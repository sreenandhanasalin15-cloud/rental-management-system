<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Pending | RentalHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow text-center">
                <div class="card-body p-5">

                    <div class="mb-4">
                        <span style="font-size: 60px;">⏳</span>
                    </div>

                    <h2 class="mb-3">Verification Pending</h2>

                    <p class="lead text-muted">
                        Your Owner account is currently under review by our admin team.
                    </p>

                    <p>
                        You will gain full access to the Owner Dashboard once your account
                        has been verified.
                    </p>

                    <div class="alert alert-info mt-4">
                        Please check back later or contact support if verification takes longer than expected.
                    </div>

                    <div class="mt-4">
                        <a href="{% url 'logout' %}" class="btn btn-danger me-2">
                            Logout
                        </a>

                        <a href="{% url 'index' %}" class="btn btn-secondary">
                            Back to Home
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
