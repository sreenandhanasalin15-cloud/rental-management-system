{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Payment Failed | RentHive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-danger">
                    <div class="card-body text-center p-5">
                        <i class="bi bi-x-circle-fill text-danger" style="font-size: 4rem;"></i>
                        <h2 class="mt-3 text-danger">Payment Failed!</h2>
                        <p class="text-muted">{{ error|default:"Your payment could not be processed. Please try again." }}</p>
                        <a href="{% url 'rentals:user_dashboard' %}" class="btn btn-primary mt-3">
                            Go to Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
