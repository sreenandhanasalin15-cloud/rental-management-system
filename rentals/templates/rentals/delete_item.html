{% extends "base.html" %}
{% load static %}

{% block content %}
<style>
    * {
        font-family: 'Inter', sans-serif;
    }

    body {
        background: linear-gradient(135deg, #f8fafc 0%, #f0f9ff 100%);
        min-height: 100vh;
    }

    .container {
        max-width: 600px;
    }

    .card {
        background: #ffffff;
        border-radius: 20px;
        border: 1px solid #e0f2fe;
        box-shadow: 0 20px 40px rgba(37, 99, 235, 0.05);
        transition: all 0.3s ease;
    }

    .card:hover {
        box-shadow: 0 25px 50px rgba(37, 99, 235, 0.08);
        border-color: #93c5fd;
    }

    h3 {
        color: #dc2626;
        font-weight: 700;
        margin-bottom: 1rem;
    }

    p {
        color: #475569;
        font-size: 1.1rem;
        margin-bottom: 2rem;
    }

    strong {
        color: #2563eb;
    }

    .btn-danger {
        background: #dc2626;
        color: white;
        border: 1px solid #dc2626;
        border-radius: 12px;
        padding: 0.8rem 2rem;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
    }

    .btn-danger:hover {
        background: #b91c1c;
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(220, 38, 38, 0.2);
        color: white;
    }

    .btn-secondary {
        background: #ffffff;
        color: #2563eb;
        border: 1px solid #dbeafe;
        border-radius: 12px;
        padding: 0.8rem 2rem;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-block;
        margin-left: 0.5rem;
    }

    .btn-secondary:hover {
        background: #eff6ff;
        border-color: #2563eb;
        transform: translateY(-2px);
        color: #2563eb;
    }

    .warning-icon {
        font-size: 4rem;
        color: #dc2626;
        margin-bottom: 1rem;
    }

    /* Animation */
    [data-aos] {
        pointer-events: none;
    }
    
    [data-aos].aos-animate {
        pointer-events: auto;
    }
</style>

<!-- AOS Animation Library -->
<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<div class="container mt-5" data-aos="fade-up">
    <div class="card shadow p-4 text-center">
        <div class="warning-icon">
            <i class="bi bi-exclamation-triangle-fill"></i>
        </div>
        <h3 class="text-danger">Delete Item</h3>
        <p>Are you sure you want to delete <strong>{{ item.name }}</strong>?</p>
        
        {% if item.image %}
        <div class="mb-4">
            <img src="{{ item.image.url }}" alt="{{ item.name }}" style="max-width: 200px; border-radius: 8px; border: 2px solid #dbeafe;">
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn-danger">
                <i class="bi bi-trash3 me-2"></i>Yes, Delete
            </button>
            <a href="{% url 'rentals:owner_dashboard' %}" class="btn-secondary">
                <i class="bi bi-x-lg me-2"></i>Cancel
            </a>
        </form>
    </div>
</div>

<script>
    AOS.init({
        duration: 800,
        once: true,
        offset: 20
    });
</script>
{% endblock %}
