{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Write a Review | RentalHub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #f0f9ff 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 600px; }
        .card {
            background: white;
            border-radius: 20px;
            border: 1px solid #e0f2fe;
            padding: 2rem;
        }
        h3 { color: #2563eb; font-weight: 700; }
        .rating-stars {
            font-size: 2rem;
            color: #d1d5db;
            cursor: pointer;
        }
        .rating-stars .bi-star-fill { color: #fbbf24; }
        .btn-primary {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <h3 class="text-center mb-4">
                <i class="bi bi-star me-2"></i>Write a Review
            </h3>
            
            <div class="text-center mb-4">
                <strong>{{ booking.item.name }}</strong><br>
                <small class="text-muted">Rented from {{ booking.start_date|date:"M d" }} to {{ booking.end_date|date:"M d, Y" }}</small>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-4 text-center">
                    <label class="form-label d-block">Your Rating</label>
                    <div class="rating-stars" id="starRating">
                        <i class="bi bi-star" data-value="1"></i>
                        <i class="bi bi-star" data-value="2"></i>
                        <i class="bi bi-star" data-value="3"></i>
                        <i class="bi bi-star" data-value="4"></i>
                        <i class="bi bi-star" data-value="5"></i>
                    </div>
                    <input type="hidden" name="stars" id="ratingValue" value="5">
                </div>
                
                <div class="mb-4">
                    <label class="form-label">Your Review</label>
                    <textarea name="review" class="form-control" rows="4" 
                              placeholder="Share your experience with this item..."></textarea>
                </div>
                
                <button type="submit" class="btn-primary">
                    <i class="bi bi-send me-2"></i>Submit Review
                </button>
            </form>
        </div>
    </div>
    
    <script>
        const stars = document.querySelectorAll('#starRating i');
        const ratingInput = document.getElementById('ratingValue');
        
        stars.forEach(star => {
            star.addEventListener('mouseover', function() {
                const value = this.dataset.value;
                highlightStars(value);
            });
            
            star.addEventListener('mouseout', function() {
                const currentValue = ratingInput.value;
                highlightStars(currentValue);
            });
            
            star.addEventListener('click', function() {
                const value = this.dataset.value;
                ratingInput.value = value;
                highlightStars(value);
            });
        });
        
        function highlightStars(value) {
            stars.forEach(star => {
                const starValue = star.dataset.value;
                if (starValue <= value) {
                    star.className = 'bi bi-star-fill';
                } else {
                    star.className = 'bi bi-star';
                }
            });
        }
        
        // Initialize with 5 stars
        highlightStars(5);
    </script>
</body>
</html>
